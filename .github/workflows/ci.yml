name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - name: Install test dependencies
        # Deliberately minimal: unit tests exercise pure functions in
        # R/functions.R and don't need the full TCGAbiolinks/DESeq2 stack,
        # so CI stays fast and avoids the Bioconductor binary issues on
        # Apple Silicon that this repo hit locally.
        run: |
          install.packages(c("testthat", "survival"))
        shell: Rscript {0}

      - name: Run unit tests
        run: Rscript tests/run_tests.R

      - name: Run toy example
        # Synthetic cohort with planted answers; needs only base R and survival.
        run: Rscript example/toy_example.R
