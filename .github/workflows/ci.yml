name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - name: Install test dependencies
        # Deliberately minimal: unit tests exercise pure functions in
        # R/functions.R and don't need the full TCGAbiolinks/DESeq2 stack,
        # so CI stays fast and avoids the arm64 Bioconductor binary issues
        # this repo hit locally on Apple Silicon.
        run: |
          install.packages(c("testthat"))
        shell: Rscript {0}

      - name: Run unit tests
        run: Rscript tests/run_tests.R
